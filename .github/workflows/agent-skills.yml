name: Agent skills

# Validates the agent skills in .claude/skills. No dependencies.
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.github/scripts/validate-skills.*'
      - '.github/workflows/agent-skills.yml'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.github/scripts/validate-skills.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-test the validator
        run: node --test .github/scripts/validate-skills.test.mjs
      - name: Validate the skills
        run: node .github/scripts/validate-skills.mjs
